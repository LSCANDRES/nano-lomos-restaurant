name: CI - Pull Request Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # ============================================
  # BACKEND - Build & Type Check
  # ============================================
  backend-check:
    name: 🔧 Backend Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nanolomos_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-disposable-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nanolomos_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:ci-disposable-only@127.0.0.1:5432/nanolomos_ci
      JWT_SECRET: ci-access-secret-disposable-only-32-chars
      JWT_REFRESH_SECRET: ci-refresh-secret-disposable-only-32-chars

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript compile check
        run: npm run build

      - name: Prepare disposable database
        run: npx prisma db push --skip-generate

      - name: Run backend tests
        run: npm test

      - name: Check for build errors
        run: |
          if [ -d "dist" ]; then
            echo "✅ Backend built successfully"
            ls -la dist/
          else
            echo "❌ Build directory not found"
            exit 1
          fi

  # ============================================
  # FRONTEND - Lint & Build
  # ============================================
  frontend-check:
    name: 🎨 Frontend Build & Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint || echo "⚠️ Lint warnings found (non-blocking)"
        continue-on-error: true

      - name: Build Frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.com
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: placeholder

      - name: Run frontend tests
        run: npm test

      - name: Check build output
        run: |
          if [ -d ".next" ]; then
            echo "✅ Frontend built successfully"
          else
            echo "❌ Build failed"
            exit 1
          fi

  # ============================================
  # DOCKER - Verify Dockerfiles
  # ============================================
  docker-check:
    name: 🐳 Docker Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Backend Dockerfile
        run: |
          docker build --file docker/Dockerfile.backend \
            --target builder \
            --tag test-backend:ci \
            . || exit 1
          echo "✅ Backend Dockerfile valid"

      - name: Verify Frontend Dockerfile
        run: |
          docker build --file docker/Dockerfile.frontend \
            --build-arg NEXT_PUBLIC_API_URL=https://api.example.com \
            --target builder \
            --tag test-frontend:ci \
            . || exit 1
          echo "✅ Frontend Dockerfile valid"

  # ============================================
  # SUMMARY - All checks passed
  # ============================================
  ci-summary:
    name: ✅ CI Summary
    needs: [backend-check, frontend-check, docker-check]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check results
        run: |
          echo "## 📋 CI Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.backend-check.result }}" == "success" ]; then
            echo "✅ Backend: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Backend: Failed" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.frontend-check.result }}" == "success" ]; then
            echo "✅ Frontend: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Frontend: Failed" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.docker-check.result }}" == "success" ]; then
            echo "✅ Docker: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Docker: Failed" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Fail if any check failed
        if: contains(needs.*.result, 'failure')
        run: exit 1
