version: '3.8'

services:
  nanlomo-backend:
    image: mambru94/nanlomo-backend:latest
    container_name: nanlomo-backend
    restart: unless-stopped
    ports:
      - "3002:3002"
    extra_hosts:
      - "postgres-server:192.168.100.35"
    environment:
      NODE_ENV: production
      PORT: 3002
      DB_HOST: postgres-server
      DB_PORT: ${DB_PORT:-5433}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-NANOLOMOS}
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD}@postgres-server:${DB_PORT:-5433}/${DB_NAME:-NANOLOMOS}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
      SESSION_TIMEOUT_MINUTES: ${SESSION_TIMEOUT_MINUTES:-30}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-10}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_VERIFY_URL: ${EMAIL_VERIFY_URL}
      EMAIL_RESET_URL: ${EMAIL_RESET_URL}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://nanolomos.cals.com.ar}
      WS_PING_INTERVAL: ${WS_PING_INTERVAL:-25000}
      WS_PING_TIMEOUT: ${WS_PING_TIMEOUT:-5000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    volumes:
      - backend-uploads:/app/uploads
    networks:
      - docker
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3002/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  nanlomo-frontend:
    image: mambru94/nanlomo-frontend:latest
    container_name: nanlomo-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://nanolomos.cals.com.ar/api}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-wss://nanolomos.cals.com.ar}
    depends_on:
      - nanlomo-backend
    networks:
      - docker
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  docker:
    external: true

volumes:
  backend-uploads:
