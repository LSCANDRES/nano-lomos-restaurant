version: '3.8'

services:
  nanlomo-backend:
    image: mambru94/nanlomo-backend:latest
    container_name: nanlomo-backend
    restart: unless-stopped
    ports:
      - "3002:3002"
    extra_hosts:
      - "postgres-server:192.168.100.35"
    environment:
      NODE_ENV: production
      PORT: 3002
      DB_HOST: postgres-server
      DB_PORT: ${DB_PORT:-5433}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-NANOLOMOS}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-30m}
      SESSION_TIMEOUT_MINUTES: ${SESSION_TIMEOUT_MINUTES:-30}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-10}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://nanolomos.cals.com.ar}
      WS_PING_INTERVAL: ${WS_PING_INTERVAL:-25000}
      WS_PING_TIMEOUT: ${WS_PING_TIMEOUT:-5000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    networks:
      - docker

  nanlomo-frontend:
    image: mambru94/nanlomo-frontend:latest
    container_name: nanlomo-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
    depends_on:
      - nanlomo-backend
    networks:
      - docker

networks:
  docker:
    external: true
