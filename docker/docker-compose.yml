version: '3.8'

# Docker Compose para MI_APP
# Backend + Frontend (build local)

services:
  mi-app-backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: mi-app-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    extra_hosts:
      - "postgres-server:192.168.100.35"
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: postgres-server
      DB_PORT: ${DB_PORT:-5433}
      DB_USER: ${DB_USER:-postgres}
      DB_PASS: ${DB_PASS}
      DB_NAME: ${DB_NAME:-MI_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 7d
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      FRONTEND_URL: https://MI_DOMINIO
      CORS_ORIGINS: https://MI_DOMINIO
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASS: ${EMAIL_PASS}
    networks:
      - docker

  mi-app-frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: https://MI_DOMINIO/api
    container_name: mi-app-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://MI_DOMINIO/api
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    depends_on:
      - mi-app-backend
    networks:
      - docker

networks:
  docker:
    external: true
