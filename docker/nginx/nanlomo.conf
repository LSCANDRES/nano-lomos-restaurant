# ==========================================
# NANLOMO - Nginx Host Configuration
# ==========================================
# Copiar este archivo a /data/nginx/conf.d/nanlomo.conf en el servidor

upstream nanlomo_backend {
    server nanlomo-backend:3002;
    keepalive 32;
}

upstream nanlomo_frontend {
    server nanlomo-frontend:80;
    keepalive 32;
}

# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name nanolomos.cals.com.ar;
    
    # Para certbot (acme challenge)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS Server - Frontend
server {
    listen 443 ssl;
    http2 on;
    server_name nanolomos.cals.com.ar;

    # SSL Certificates (montados desde ./certificados -> /etc/nginx/ssl)
    ssl_certificate /etc/nginx/ssl/nanolomos/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/nanolomos/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # SSL Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Frontend
    location / {
        proxy_pass http://nanlomo_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # API Backend
    location /api/ {
        proxy_pass http://nanlomo_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts for API
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # WebSocket para actualizaciones en tiempo real
    location /socket.io/ {
        proxy_pass http://nanlomo_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket timeouts
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }

    # Health check endpoints
    location /health {
        proxy_pass http://nanlomo_frontend/health;
        access_log off;
    }

    location /api/health {
        proxy_pass http://nanlomo_backend/api/health;
        access_log off;
    }
}
