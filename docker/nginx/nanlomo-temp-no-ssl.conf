# ==========================================
# NANLOMO - Nginx TEMPORAL (sin SSL)
# ==========================================
# Usar esto PRIMERO para generar certificados con certbot
# Luego reemplazar con nanlomo.conf (con SSL)

upstream nanlomo_backend {
    server nanlomo-backend:3002;
    keepalive 32;
}

upstream nanlomo_frontend {
    server nanlomo-frontend:80;
    keepalive 32;
}

server {
    listen 80;
    server_name nanolomos.cals.com.ar;

    # Para certbot (acme challenge)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Frontend
    location / {
        proxy_pass http://nanlomo_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API Backend
    location /api/ {
        proxy_pass http://nanlomo_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket
    location /socket.io/ {
        proxy_pass http://nanlomo_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
